included:
  - FitMe
  - FitMeTests
  - Packages/FitEngine/Sources
  - Packages/FitEngine/Tests
excluded:
  - "**/.build"
  - DerivedData

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - empty_count
  - first_where
  - contains_over_first_not_nil
  - sorted_first_last
  - redundant_nil_coalescing
  - unneeded_parentheses_in_closure_argument
  - private_swiftui_state
  - fatal_error_message

analyzer_rules:
  - unused_declaration
  - unused_import

disabled_rules:
  - todo                # TODOs are banned by review instead (see ENGINEERING_STANDARDS.md)
  - trailing_comma      # SwiftFormat owns formatting
  - opening_brace
  - identifier_name     # short math names (L, a, b, h) are standard in color code

line_length:
  warning: 120
  error: 140
  ignores_comments: true
  ignores_urls: true
function_body_length:
  warning: 60
  error: 100
type_body_length:
  warning: 300
  error: 450
file_length:
  warning: 450
  error: 600
cyclomatic_complexity:
  warning: 12
  error: 20

force_unwrapping:
  severity: error
